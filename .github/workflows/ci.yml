name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read
  pull-requests: read

jobs:
  validate:
    name: Validate workspace
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run linter
        run: pnpm lint

      - name: Run API tests
        run: pnpm --filter @loongarch-b1/api test

      - name: Run repository script tests
        run: pnpm test:scripts

      - name: Build workspace
        run: pnpm build

  sourcery:
    name: Sourcery AI code review
    runs-on: ubuntu-latest
    env:
      SOURCERY_TOKEN: ${{ secrets.SOURCERY_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python for Sourcery
        if: env.SOURCERY_TOKEN != ''
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Run Sourcery on pull requests
        if: github.event_name == 'pull_request' && env.SOURCERY_TOKEN != ''
        uses: sourcery-ai/action@v1
        with:
          token: ${{ env.SOURCERY_TOKEN }}
          diff_ref: ${{ github.event.pull_request.base.sha }}
          target: apps docs scripts

      - name: Run Sourcery on branch pushes
        if: github.event_name != 'pull_request' && env.SOURCERY_TOKEN != ''
        uses: sourcery-ai/action@v1
        with:
          token: ${{ env.SOURCERY_TOKEN }}
          target: apps docs scripts

      - name: Skip Sourcery without token
        if: env.SOURCERY_TOKEN == ''
        run: echo "SOURCERY_TOKEN is not configured; skipping Sourcery AI code review."
