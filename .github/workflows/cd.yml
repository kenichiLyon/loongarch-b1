name: CD

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  NODE_VERSION: 22
  PNPM_VERSION: 10.33.2

jobs:
  package:
    name: Build and publish artifacts
    runs-on: ubuntu-latest
    env:
      SOURCERY_TOKEN: ${{ secrets.SOURCERY_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python for Sourcery
        if: env.SOURCERY_TOKEN != ''
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Run Sourcery release review
        if: env.SOURCERY_TOKEN != ''
        uses: sourcery-ai/action@v1
        with:
          token: ${{ env.SOURCERY_TOKEN }}
          target: apps docs scripts

      - name: Skip Sourcery without token
        if: env.SOURCERY_TOKEN == ''
        run: echo "SOURCERY_TOKEN is not configured; skipping Sourcery AI release review."

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run linter
        run: pnpm lint

      - name: Run API tests
        run: pnpm --filter @loongarch-b1/api test

      - name: Build workspace
        run: pnpm build

      - name: Build runtime bundle
        run: pnpm bundle:runtime

      - name: Stage release payload
        shell: bash
        run: |
          set -euo pipefail
          short_sha="${GITHUB_SHA::7}"
          version="${GITHUB_REF_NAME}"
          build_time="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"

          mkdir -p release/web release/api/dist release/api/migrations release/docs release/scripts release/docker-context release/bundles
          cp -R apps/web/dist/. release/web/
          cp -R apps/api/dist/. release/api/dist/
          cp -R apps/api/migrations/. release/api/migrations/
          cp apps/api/package.json release/api/package.json
          cp package.json pnpm-lock.yaml pnpm-workspace.yaml .npmrc .env.example README.md AGENT.md release/
          cp -R docs/. release/docs/
          cp -R scripts/. release/scripts/
          cp Dockerfile compose.yaml .dockerignore release/docker-context/
          cp package.json pnpm-lock.yaml pnpm-workspace.yaml tsconfig.base.json .npmrc .env.example README.md AGENT.md release/docker-context/
          cp -R apps/. release/docker-context/apps/
          cp -R docs/. release/docker-context/docs/
          cp -R scripts/. release/docker-context/scripts/

          cat > release/BUILD_MANIFEST.json <<EOF
          {
            "project": "loongarch-b1",
            "version": "${version}",
            "commit": "${GITHUB_SHA}",
            "shortCommit": "${short_sha}",
            "ref": "${GITHUB_REF}",
            "buildTime": "${build_time}",
            "nodeVersion": "${NODE_VERSION}",
            "pnpmVersion": "${PNPM_VERSION}",
            "target": "LoongArch + Kylin Advanced Server",
            "artifacts": [
              "loongarch-b1-runtime-${short_sha}.tar.gz",
              "loongarch-b1-runtime-npm-${short_sha}.tgz",
              "loongarch-b1-web-${short_sha}.tar.gz",
              "loongarch-b1-api-${short_sha}.tar.gz",
              "loongarch-b1-docs-${short_sha}.tar.gz",
              "loongarch-b1-docker-context-${short_sha}.tar.gz"
            ]
          }
          EOF

          tar -czf "release/bundles/loongarch-b1-runtime-${short_sha}.tar.gz" -C release/runtime .
          tar -czf "release/bundles/loongarch-b1-web-${short_sha}.tar.gz" -C release/web .
          tar -czf "release/bundles/loongarch-b1-api-${short_sha}.tar.gz" -C release/api .
          tar -czf "release/bundles/loongarch-b1-docs-${short_sha}.tar.gz" -C release README.md AGENT.md docs .env.example BUILD_MANIFEST.json
          tar -czf "release/bundles/loongarch-b1-docker-context-${short_sha}.tar.gz" -C release/docker-context .

      - name: Upload auto build artifact
        uses: actions/upload-artifact@v4
        with:
          name: loongarch-b1-auto-build-${{ github.ref_name }}-${{ github.sha }}
          path: release/
          retention-days: 30

      - name: Publish or update prerelease for main
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          pre_tag="pre-main"
          short_sha="${GITHUB_SHA::7}"
          build_time="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          notes="Latest auto build artifacts from main.

          Commit: ${GITHUB_SHA}
          Short commit: ${short_sha}
          Build time: ${build_time}

          This prerelease is an artifact carrier for the latest main build. The attached bundles and BUILD_MANIFEST.json are the source of truth for the exact runtime contents."

          if gh release view "${pre_tag}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${pre_tag}" \
              release/bundles/*.tar.gz \
              release/BUILD_MANIFEST.json \
              --clobber \
              --repo "${GITHUB_REPOSITORY}"
            gh release edit "${pre_tag}" \
              --title "pre-main" \
              --notes "${notes}" \
              --prerelease \
              --repo "${GITHUB_REPOSITORY}"
          else
            gh release create "${pre_tag}" \
              release/bundles/*.tar.gz \
              release/BUILD_MANIFEST.json \
              --repo "${GITHUB_REPOSITORY}" \
              --title "pre-main" \
              --notes "${notes}" \
              --prerelease \
              --target "${GITHUB_SHA}"
          fi

      - name: Publish GitHub release on version tags
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" \
            release/bundles/*.tar.gz \
            release/BUILD_MANIFEST.json \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --notes "Automated build artifacts for ${GITHUB_REF_NAME}. Target deployment: LoongArch + Kylin Advanced Server."
